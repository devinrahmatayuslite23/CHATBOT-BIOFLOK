  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; }
    
    .tree-viewport {
      width: 100%; height: 600px; overflow: hidden; position: relative;
      cursor: grab; background: #f8fafc; border-radius: 8px;
    }
    .dark-view .tree-viewport { background: #1e293b; }
    .tree-viewport:active { cursor: grabbing; }
    .tree-content {
      position: absolute; top: 0; left: 0;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px; transform-origin: 0 0; width: max-content; min-width: 100%;
    }
    
    /* Row of children */
    .children-row { display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 24px; margin-top: 0; }
    .node-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; }
    
    /* Feature node (split point) */
    .node-box {
      background: #22d3ee; border: 2px solid #000; color: #000;
      font-weight: 700; font-family: monospace; padding: 6px 10px;
      min-width: 100px; text-align: center; font-size: 11px; border-radius: 2px;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.2); white-space: nowrap; z-index: 10; position: relative;
    }
    
    /* Branch label (PASS/FAIL) */
    .branch-row { display: flex; flex-direction: row; align-items: flex-start; justify-content: center; margin-top: 0; gap: 4px; }
    .branch-col { display: flex; flex-direction: column; align-items: center; min-width: 60px;  }
    .branch-badge {
      font-size: 10px; font-weight: 800; padding: 2px 8px;
      border-radius: 3px; margin-bottom: 2px; color: #fff;
      white-space: nowrap;
    }
    .badge-pass { background: #22c55e; }
    .badge-fail { background: #ef4444; }
    
    /* Connector line */
    .v-line { width: 2px; background: #64748b; height: 20px; }
    .h-line { height: 2px; background: #64748b; align-self: flex-start; }
    
    /* Leaf node */
    .leaf-box {
      background: #fef08a; border: 2px solid #000; color: #000;
      font-size: 9px; font-weight: 600; padding: 8px 12px;
      border-radius: 6px; min-width: 150px; max-width: 200px;
      text-align: center; cursor: pointer; min-height: 60px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
      transition: transform 0.15s;
    }
    .leaf-box:hover { transform: scale(1.05); background: #fff9c4; }
    .leaf-box .freq-badge {
      margin-top: 4px; font-size: 8px; background: #fef9c3;
      border: 1px solid #ca8a04; border-radius: 3px; padding: 1px 6px; color: #92400e;
    }
    
    /* Control toolbar */
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; }
    .zoom-btn {
      padding: 5px 12px; border-radius: 5px; font-weight: 700;
      cursor: pointer; font-size: 13px; border: none;
      background: #334155; color: #e2e8f0;
      transition: background 0.15s;
    }
    .zoom-btn:hover { background: #475569; }
    .zoom-btn.reset { background: #1e40af; color: white; }
    .zoom-btn.reset:hover { background: #1d4ed8; }
    
    /* Tabs */
    .tab-btn {
      padding: 8px 20px; border-radius: 6px 6px 0 0; font-weight: 700;
      cursor: pointer; border: 2px solid transparent;
      background: #1e293b; color: #94a3b8; font-size: 13px; transition: all 0.15s;
    }
    .tab-btn.active { background: #0ea5e9; color: white; border-color: #0284c7; }
    .tab-btn:hover:not(.active) { background: #334155; color: #e2e8f0; }
    
    /* Stats */
    .stat-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      padding: 12px 16px; text-align: center; min-width: 100px;
    }
    .stat-card .val { font-size: 22px; font-weight: 800; color: #38bdf8; }
    .stat-card .lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Connector SVG overlay */
    .connector { stroke: #64748b; stroke-width: 1.5; fill: none; }
  </style>
</head>

    let treeData = null;
    let currentAlgo = 'eff';
    let scale = 1.0;
    let panX = 0, panY = 0;
    let isPanning = false;
    let startX, startY;
    
    function loadData() {
      try {
        treeData = JSON.parse(TREE_DATA_JSON);
        renderTree(currentAlgo);
      } catch(e) {
        document.getElementById('treeContent').innerHTML =
          '<div class="text-red-400 p-8">Error: ' + e.message + '</div>';
      }
    }
    
    // ===== STATS =====
    function countLeaves(node) {
      if (!node || node.leaf) return 1;
      return countLeaves(node.pass) + countLeaves(node.fail);
    }
    function getDepth(node, d) {
      if (!node || node.leaf) return d;
      return Math.max(getDepth(node.pass, d+1), getDepth(node.fail, d+1));
    }
    
    // ===== RENDER TREE =====
    function renderTree(algo) {
      currentAlgo = algo;
      const tree = treeData.trees[algo];
      if (!tree) return;
      
      const labels = { eff: 'Efficiency (Gain²/Cost)', id3: 'ID3 (Classic)', voi: 'VOI (Cost-Sensitive)' };
      document.getElementById('mode-label').textContent = labels[algo];
      document.getElementById('stat-root').textContent = tree.feature || tree.decision;
      document.getElementById('stat-leaves').textContent = countLeaves(tree);
      document.getElementById('stat-depth').textContent = getDepth(tree, 0);
      
      const content = document.getElementById('treeContent');
      content.innerHTML = '';
      const el = buildNodeEl(tree);
      content.appendChild(el);
      
      // Reset pan/zoom
      scale = 0.8; panX = 0; panY = 0;
      applyTransform();
    }
    
    function buildNodeEl(node) {
      const wrapper = document.createElement('div');
      wrapper.className = 'node-wrapper';
      
      if (!node || node.leaf) {
        // Leaf
        const box = document.createElement('div');
        box.className = 'leaf-box';
        box.textContent = node ? node.decision : 'Unknown';
        wrapper.appendChild(box);
        return wrapper;
      }
      
      // Feature split node
      const topLine = document.createElement('div');
      topLine.className = 'v-line';
      wrapper.appendChild(topLine);
      
      const nodeBox = document.createElement('div');
      nodeBox.className = 'node-box';
      nodeBox.textContent = node.feature;
      wrapper.appendChild(nodeBox);
      
      const bottomLine = document.createElement('div');
      bottomLine.className = 'v-line';
      wrapper.appendChild(bottomLine);
      
      // Children row
      const childRow = document.createElement('div');
      childRow.className = 'children-row';
      
      // PASS child
      const passCol = document.createElement('div');
      passCol.className = 'branch-col';
      const passBadge = document.createElement('div');
      passBadge.className = 'branch-badge badge-pass';
      passBadge.textContent = 'PASS';
      passCol.appendChild(passBadge);
      const passLine = document.createElement('div');
      passLine.className = 'v-line';
      passCol.appendChild(passLine);
      if (node.pass) passCol.appendChild(buildNodeEl(node.pass));
      childRow.appendChild(passCol);
      
      // FAIL child
      const failCol = document.createElement('div');
      failCol.className = 'branch-col';
      const failBadge = document.createElement('div');
      failBadge.className = 'branch-badge badge-fail';
      failBadge.textContent = 'FAIL';
      failCol.appendChild(failBadge);
      const failLine = document.createElement('div');
      failLine.className = 'v-line';
      failCol.appendChild(failLine);
      if (node.fail) failCol.appendChild(buildNodeEl(node.fail));
      childRow.appendChild(failCol);
      
      wrapper.appendChild(childRow);
      return wrapper;
    }
    
    // ===== ZOOM & PAN =====
    function applyTransform() {
      const content = document.getElementById('treeContent');
      content.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      content.style.transformOrigin = 'top center';
      document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
    }
    
    function zoomBy(delta) {
      scale = Math.max(0.1, Math.min(3.0, scale + delta));
      applyTransform();
    }
    
    document.getElementById('btn-in').onclick = () => zoomBy(0.15);
    document.getElementById('btn-out').onclick = () => zoomBy(-0.15);
    document.getElementById('btn-reset').onclick = () => {
      scale = 0.8; panX = 0; panY = 0; applyTransform();
    };
    
    const vp = document.getElementById('treeViewport');
    vp.addEventListener('wheel', e => {
      e.preventDefault();
      zoomBy(e.deltaY > 0 ? -0.1 : 0.1);
    }, { passive: false });
    
    vp.addEventListener('mousedown', e => {
      isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY;
    });
    vp.addEventListener('mousemove', e => {
      if (!isPanning) return;
      panX = e.clientX - startX; panY = e.clientY - startY; applyTransform();
    });
    vp.addEventListener('mouseup', () => isPanning = false);
    vp.addEventListener('mouseleave', () => isPanning = false);
    
    // ===== ALGO TAB SWITCH =====
    function switchAlgo(algo, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTree(algo);
    }
    
    // ===== BOOT =====
    loadData();
  </script>
